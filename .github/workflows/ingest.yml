name: ingest

# Daily fetch of the IRCC Express Entry feed → Supabase.
#
# Runs every day at 13:15 UTC (~9:15am ET / 6:15am PT). IRCC draws are
# announced any day of the week; the plan says "poll daily".
#
# Manual trigger is enabled so we can force-refresh after a shape fix.

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write   # to open a GitHub issue when a run fails

    defaults:
      run:
        working-directory: scripts/ingest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m ingest.run

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `Ingest failed — ${today}`;
            // Skip if an open failure issue already exists for today.
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Ingest failed"`,
            });
            const already = search.data.items.find(i => i.title === title);
            if (already) {
              console.log(`existing issue #${already.number} — not duplicating`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["ingest", "bug"],
              body: [
                `The scheduled ingest job failed.`,
                ``,
                `**Run:** ${runUrl}`,
                ``,
                `The site is still serving last-known-good data — this issue is a heads-up, not an outage.`,
                ``,
                `**First check:** was there a shape change in the IRCC feed?`,
                `Update \`scripts/ingest/ingest/schema.py\` and \`normalize.py\`, refresh the fixture, and re-run \`pytest\`.`,
              ].join("\n"),
            });
